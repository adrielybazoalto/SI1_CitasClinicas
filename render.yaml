services:
  - type: web
    name: si1-citas-clinicas
    env: docker
    region: ohio
    plan: free
    branch: main
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_TIMEZONE
        value: America/La_Paz
      - key: DB_CONNECTION
        value: pgsql
      # Las credenciales de la base de datos (APP_KEY, DB_HOST, 
      # DB_PASSWORD, etc.) deben configurarse de forma segura 
      # directamente en el panel web de Render, no aquí.